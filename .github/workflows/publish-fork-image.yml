name: Publish fork Docker image (Lylead)

# Imagen de Evolution 2.4.0-rc2 con Baileys 7.0.0-rc14 y etiquetado de listas por LID.
# Se publica en GHCR para que Coolify la use en lugar de evoapicloud/evolution-api.
on:
  push:
    branches:
      - 'lylead/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repo
        id: vars
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Evolution API 2.4.0-rc2 + Baileys 7.0.0-rc14 + labels by LID (Lylead)
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo }}:lylead-labels
            ghcr.io/${{ steps.vars.outputs.repo }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
